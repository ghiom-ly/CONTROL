<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصور كبيرة</title>
<style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f1f5f9; color: #1e293b; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; }
    .box { background: #fff; border-radius: 16px; padding: 24px; max-width: 420px; box-shadow: 0 4px 20px rgba(15, 23, 42, .08); line-height: 1.9; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    a { display: inline-block; margin-top: 12px; background: #1e3a5f; color: #fff; padding: 10px 18px; border-radius: 10px; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
    <h1>حجم الصور المرفوعة كبير</h1>
    <p>الصور اللي اخترتها مع بعض أكبر من المسموح. ارجع للصفحة وارفعها على دفعتين أو ثلاث (مثلاً 10 صور في كل مرة)، أو حدّث الصفحة لأن النسخة الجديدة تصغّر الصور تلقائياً.</p>
    <a href="javascript:history.back()">رجوع</a>
</div>
</body>
</html>
